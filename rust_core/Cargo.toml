[package]
name = "mubaddil_core"
version = "2.0.0"
edition = "2021"
description = "Mubaddil - Intelligent Keyboard Layout Switcher Native Core"
authors = ["Mubaddil Team"]
license = "MIT"

[lib]
name = "mubaddil_core"
crate-type = ["cdylib"]

[dependencies]
pyo3 = { version = "0.20", features = ["extension-module"] }
windows-sys = { version = "0.52", features = [
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_WindowsAndMessaging",
    "Win32_Foundation",
    "Win32_System_Threading",
    "Win32_Globalization",
    "Win32_System_LibraryLoader",
    "Win32_UI_Input",
]}
thiserror = "1.0"
once_cell = "1.19"
parking_lot = "0.12"

[build-dependencies]
pyo3-build-config = "0.20"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true

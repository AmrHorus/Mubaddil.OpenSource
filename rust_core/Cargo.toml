[package]
name = "mubaddil_core"
version = "0.1.0"
edition = "2021"

[lib]
name = "mubaddil_core"
crate-type = ["cdylib", "rlib"]

[dependencies]
pyo3 = { version = "0.20", features = ["extension-module"] }
windows-sys = { version = "0.52", features = [
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_WindowsAndMessaging",
    "Win32_Foundation",
    "Win32_System_Threading",
    "Win32_Globalization",
]}
strsim = "0.11"
fuzzy-matcher = "0.3"
once_cell = "1.19"

[build-dependencies]
pyo3-build-config = "0.20"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true

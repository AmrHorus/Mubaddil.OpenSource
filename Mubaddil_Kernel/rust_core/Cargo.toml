[package]
name = "mubaddil_kernel"
version = "3.0.0"
edition = "2021"
description = "Mubaddil Kernel - Core Intelligence Engine for Keyboard Layout Detection and Correction"
authors = ["Mubaddil Team"]
license = "MIT"
readme = "README.md"

[lib]
name = "mubaddil_kernel"
crate-type = ["cdylib", "rlib"]

[dependencies]
# Python bindings
pyo3 = { version = "0.20", features = ["extension-module"] }

# Error handling
thiserror = "1.0"

# Concurrency
parking_lot = "0.12"
once_cell = "1.19"

# Serialization for keyboard layouts
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Unicode handling
unicode-segmentation = "1.10"

# Note: Windows-specific APIs are NOT included here
# They belong in the Integration layer, not the kernel

[build-dependencies]
pyo3-build-config = "0.20"

[dev-dependencies]
criterion = "0.5"

# Benchmarks will be added later
# [[bench]]
# name = "mapping_benchmark"
# harness = false

# [[bench]]
# name = "detection_benchmark"
# harness = false

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true

[profile.dev]
opt-level = 0
debug = true
